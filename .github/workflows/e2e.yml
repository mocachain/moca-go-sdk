name: End to End Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  MocaTag: main
  MocaCommonTag: main
  MocaStorageProviderTag: fix/update-moca-main-deps
  GOPRIVATE: github.com/mocachain
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_ROOT_PASSWORD: root
  MYSQL_IP: 127.0.0.1
  MYSQL_PORT: 3306

jobs:
  end-to-end-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        os: [ubuntu-latest]
    env:
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPROXY: https://proxy.golang.org,direct
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Checkout dependency repos
        run: |
          git clone https://github.com/mocachain/moca.git ../moca
          cd ../moca
          git checkout ${{ env.MocaTag }}
          cd ../moca-go-sdk
          git clone https://github.com/mocachain/moca-common.git ../moca-common
          cd ../moca-common
          git checkout ${{ env.MocaCommonTag }}
          cd ../moca-go-sdk
      - name: Wire local dependency graph
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          go mod edit -replace github.com/mocachain/moca/v2=../moca
          go mod edit -replace github.com/mocachain/moca-common/go=../moca-common/go
          go_cache="$(go env GOMODCACHE)/cache/vcs"
          rm -rf "${go_cache}"
          go mod download
      - name: Install compatible contract tools
        run: |
          GOTOOLCHAIN=go1.23.11 go install golang.org/x/tools/cmd/stringer@v0.30.0
          GOTOOLCHAIN=go1.23.11 go install github.com/go-bindata/go-bindata/v3/go-bindata@v3.1.3
          GOTOOLCHAIN=go1.23.11 go install github.com/fjl/gencodec@latest
          GOTOOLCHAIN=go1.23.11 go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          GOTOOLCHAIN=go1.23.11 go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      # Build Moca
      - name: Build Moca
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          cd ../moca
          make build
          cd ..
      # Build Moca-SP
      - name: Build Moca-SP
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          git clone https://github.com/mocachain/moca-storage-provider.git ../moca-storage-provider
          cd ../moca-storage-provider
          git checkout ${{ env.MocaStorageProviderTag }}
          go mod edit -replace github.com/mocachain/moca/v2=../moca
          go mod edit -replace github.com/mocachain/moca-common/go=../moca-common/go
          go_cache="$(go env GOMODCACHE)/cache/vcs"
          rm -rf "${go_cache}"
          go mod download
          make install-tools
          make build
          cd ../moca-go-sdk
      # Run MySQL
      - name: Run MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -h ${{ env.MYSQL_IP }} -P ${{ env.MYSQL_PORT }} -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }} -e 'CREATE DATABASE sp_0; CREATE DATABASE sp_1;CREATE DATABASE sp_2; CREATE DATABASE sp_3;CREATE DATABASE sp_4; CREATE DATABASE sp_5; CREATE DATABASE sp_6;'
      # Run Moca
      - name: Run Moca
        run: |
          cd ../moca
          bash ./deployment/localup/localup.sh all 1 8
          echo "=== wait for moca gRPC ==="
          for i in {1..60}; do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/19090'; then
              echo "moca gRPC is ready on 127.0.0.1:19090"
              break
            fi
            if [ "${i}" -eq 60 ]; then
              echo "moca gRPC did not become ready on 127.0.0.1:19090"
              echo "=== mocad process list ==="
              ps -ef | grep '[m]ocad' || true
              echo "=== listening ports ==="
              ss -ltnp || true
              echo "=== validator0 gRPC config ==="
              grep -n -A 8 -B 4 'Address defines the gRPC server address' ./deployment/localup/.local/validator0/config/app.toml || true
              echo "=== validator0 node.log ==="
              cat ./deployment/localup/.local/validator0/logs/node.log || true
              exit 1
            fi
            sleep 2
          done
          bash ./deployment/localup/localup.sh export_sps 1 8
          cp ./deployment/localup/.local/sp_export.json ./sp.json
          cat sp.json
          cd ../moca-go-sdk
      # Run Moca-SP
      - name: Run Moca-SPs
        run: |
          cd ../moca-storage-provider
          dump_sp_diagnostics() {
            echo "=== moca-sp process list ==="
            ps -ef | grep '[m]oca-sp' || true
            for sp_dir in deployment/localup/local_env/sp*; do
              [ -d "${sp_dir}" ] || continue
              echo "=== ${sp_dir}/sp.info ==="
              cat "${sp_dir}/sp.info" || true
              echo "=== ${sp_dir}/db.info ==="
              cat "${sp_dir}/db.info" || true
              echo "=== ${sp_dir}/config.toml key settings ==="
              grep -E '^(ChainID|ChainAddress|RpcAddress|SpOperatorAddress|GRPCAddress|HTTPAddress|P2PAddress|BsDBWriteAddress|User|Address|Database|Modules) =' "${sp_dir}/config.toml" || true
              echo "=== ${sp_dir}/log.txt ==="
              cat "${sp_dir}/log.txt" || true
            done
          }
          sed -i 's/^SP_NUM=.*/SP_NUM=2/' deployment/localup/env.info
          bash ./deployment/localup/localup.sh --generate $GITHUB_WORKSPACE/../moca/sp.json ${{ env.MYSQL_USER }} ${{ env.MYSQL_PASSWORD }} ${{ env.MYSQL_IP }}:${{ env.MYSQL_PORT }}
          bash ./deployment/localup/localup.sh --reset
          set +e
          bash ./deployment/localup/localup.sh --start
          start_status=$?
          set -e
          if [ ${start_status} -ne 0 ]; then
            dump_sp_diagnostics
            exit ${start_status}
          fi
          sleep 60
          for sp_dir in deployment/localup/local_env/sp*; do
            [ -d "${sp_dir}" ] || continue
            sp_name=$(basename "${sp_dir}")
            sp_index="${sp_name#sp}"
            sp_bin="${sp_dir}/moca-sp${sp_index}"
            sp_config="${sp_dir}/config.toml"
            if [ -x "${sp_bin}" ] && [ -f "${sp_config}" ]; then
              "${sp_bin}" update.quota --quota 5000000000 -c "${sp_config}"
            fi
          done
          ps -ef | grep moca-sp | wc -l
          tail -n 1000 deployment/localup/local_env/sp0/log.txt
          cd ../moca-go-sdk
      # Run E2E Test
      - name: start e2e
        env:
          MOCA_E2E_LOCALUP_DIR: ${{ github.workspace }}/../moca/deployment/localup/.local
          MOCA_E2E_GRPC_ENDPOINT: 127.0.0.1:19090
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          echo "=== e2e network preflight ==="
          ps -ef | grep '[m]ocad' || true
          ss -ltnp | grep -E '(:19090|:26657|:8545)' || true
          set +e
          make e2e_test
          exit_status_command=$?
          if [ $exit_status_command -eq 0 ]; then
            echo "make e2e_test successful."
          else
            echo "=== validator0 node.log ==="
            cat ../moca/deployment/localup/.local/validator0/logs/node.log || true
            cd ../moca-storage-provider
            cat ./deployment/localup/local_env/sp0/log.txt
            cat ./deployment/localup/local_env/sp1/log.txt
            cat ./deployment/localup/local_env/sp2/log.txt
            cat ./deployment/localup/local_env/sp3/log.txt
            cat ./deployment/localup/local_env/sp4/log.txt
            cat ./deployment/localup/local_env/sp5/log.txt
            cat ./deployment/localup/local_env/sp6/log.txt
            cat ./deployment/localup/local_env/sp7/log.txt
            exit $exit_status_command
          fi
          cd ..
