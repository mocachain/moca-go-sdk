name: End to End Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  GOPRIVATE: github.com/mocachain
  MOCA_E2E_TOPOLOGY: topology/sdk-3sp.yaml
  MOCA_E2E_MOCAD_IMAGE: ghcr.io/mocachain/mocad:latest
  MOCA_E2E_SP_IMAGE: ghcr.io/mocachain/moca-storage-provider:latest

jobs:
  end-to-end-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        os: [ubuntu-latest]
    env:
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPROXY: https://proxy.golang.org,direct
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Checkout image e2e harness
        uses: actions/checkout@v4
        with:
          repository: mocachain/moca-e2e
          path: ../moca-e2e

      - name: Install compose tooling
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Start image-only local stack
        working-directory: ../moca-e2e
        run: |
          cat > "${MOCA_E2E_TOPOLOGY}" <<'TOPOLOGY'
          chain:
            chain_id: moca_5151-1
            denom: amoca
            genesis_account_balance: "100000000000000000000000000"
            staking_bond_amount: "10000000000000000000000000"
            sp_min_deposit: "10000000000000000000000"
            gov_min_deposit: "10000000000000000000"
            gov_voting_period: "15s"
            block_time: "1s"

          images:
            validator: ghcr.io/mocachain/mocad:latest
            cosmovisor: ghcr.io/mocachain/mocad:latest
            storage_provider: ghcr.io/mocachain/moca-storage-provider:latest

          validators:
            - name: validator-0
              mode: docker

          storage_providers:
            - name: sp-0
            - name: sp-1
            - name: sp-2

          services:
            mysql:
              image: mysql:8.0

          ports:
            rpc_base: 26657
            grpc_base: 19090
            rest_base: 1317
            evm_rpc_base: 8545
            evm_ws_base: 8560
            p2p_base: 26600
            sp_gateway_base: 9033
            sp_p2p_base: 9400
          TOPOLOGY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/init-genesis.sh')
          s = p.read_text()
          s = s.replace('ENDPOINT="http://${SPNAME}:9033"', 'ENDPOINT="http://127.0.0.1:$((9033 + i))"')
          p.write_text(s)
          PY

          ./scripts/build.sh local "${MOCA_E2E_TOPOLOGY}"
          ./scripts/teardown.sh local
          ./scripts/generate-compose.sh "${MOCA_E2E_TOPOLOGY}" docker-compose.generated.yml
          rm -rf .docker-shared
          mkdir -p .docker-shared
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('docker-compose.generated.yml')
          lines = p.read_text().splitlines()
          out = []
          for line in lines:
              out.append(line)
              if line == '  shared-init:':
                  out.extend([
                      '    driver: local',
                      '    driver_opts:',
                      '      type: none',
                      '      o: bind',
                      '      device: ${PWD}/.docker-shared',
                  ])
          p.write_text('\\n'.join(out) + '\\n')
          PY2
          docker compose -f docker-compose.generated.yml up -d
          ./scripts/wait-for-chain.sh http://localhost:26657 5 180

      - name: Extract mocad from image
        run: |
          mkdir -p "${RUNNER_TEMP}/mocad-bin"
          cid=$(docker create --platform linux/amd64 --entrypoint /bin/sh "${MOCA_E2E_MOCAD_IMAGE}" -c true)
          docker cp "$cid:/usr/bin/mocad" "${RUNNER_TEMP}/mocad-bin/mocad"
          docker rm "$cid"
          chmod +x "${RUNNER_TEMP}/mocad-bin/mocad"

      - name: Run SDK e2e tests
        env:
          MOCA_E2E_LOCALUP_DIR: ${{ github.workspace }}/../moca-e2e/.docker-shared
          MOCA_E2E_MOCAD: ${{ runner.temp }}/mocad-bin/mocad
          MOCA_E2E_GRPC_ENDPOINT: 127.0.0.1:19090
          MOCA_E2E_ENDPOINT: http://127.0.0.1:26657
          MOCA_E2E_EVM_ENDPOINT: http://127.0.0.1:8545
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          echo "=== e2e network preflight ==="
          docker ps
          ss -ltnp | grep -E '(:19090|:26657|:8545|:9033|:9034|:9035)' || true
          make e2e_test

      - name: Dump image stack logs on failure
        if: failure()
        working-directory: ../moca-e2e
        run: |
          docker compose -f docker-compose.generated.yml ps || true
          docker compose -f docker-compose.generated.yml logs || true

      - name: Stop image stack
        if: always()
        working-directory: ../moca-e2e
        run: |
          ./scripts/teardown.sh local || true
