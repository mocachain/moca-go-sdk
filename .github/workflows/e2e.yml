name: End to End Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  MocaTag: 5666254d3403567090b7be993ac73a463d8e5a72
  MocaCommonTag: feat/evmos_replace
  MocaStorageProviderTag: 4f4184da712318def95575921605d3b4907bf716
  GOPRIVATE: github.com/mocachain
  GH_ACCESS_TOKEN: ${{ secrets.GH_TOKEN }}
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_ROOT_PASSWORD: root
  MYSQL_IP: 127.0.0.1
  MYSQL_PORT: 3306

jobs:
  end-to-end-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Setup GitHub Token
        run: git config --global url.https://$GH_ACCESS_TOKEN@github.com/.insteadOf https://github.com/
      - name: Checkout dependency repos
        run: |
          git clone https://github.com/mocachain/moca.git ../moca
          cd ../moca
          git checkout ${{ env.MocaTag }}
          cd ../moca-go-sdk
          git clone https://github.com/mocachain/moca-common.git ../moca-common
          cd ../moca-common
          git checkout ${{ env.MocaCommonTag }}
          cd ../moca-go-sdk
      - name: Wire local dependency graph
        run: |
          mkdir -p "$RUNNER_TEMP/moca-go-sdk-e2e"
          cd "$RUNNER_TEMP/moca-go-sdk-e2e"
          go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/../moca" "$GITHUB_WORKSPACE/../moca-common/go"
          go work edit -replace cosmossdk.io/api=github.com/mocachain/moca-cosmos-sdk/api@v1.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace cosmossdk.io/client/v2=github.com/mocachain/moca-cosmos-sdk/client/v2@v2.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace cosmossdk.io/simapp=github.com/mocachain/moca-cosmos-sdk/simapp@v1.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace cosmossdk.io/store=github.com/mocachain/moca-cosmos-sdk/store@v1.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace cosmossdk.io/x/nft=github.com/mocachain/moca-cosmos-sdk/x/nft@v1.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace cosmossdk.io/x/tx=github.com/mocachain/moca-cosmos-sdk/x/tx@v1.2.0-rc2.0.20260506132435-fda33c2139c4
          go work edit -replace github.com/cosmos/cosmos-sdk=github.com/mocachain/moca-cosmos-sdk@v1.2.1-0.20260506132435-fda33c2139c4
          go work edit -replace github.com/confio/ics23/go=github.com/cosmos/ics23/go@v0.10.0
          go work edit -replace github.com/cosmos/iavl=github.com/mocachain/moca-iavl@v1.2.2
          go work edit -replace github.com/cosmos/ibc-go/v10=github.com/mocachain/moca-ibc-go/v10@v10.1.1
          go work edit -replace github.com/cometbft/cometbft-db=github.com/mocachain/moca-cometbft-db@v1.1.1-0.20260316053933-22256c4c85b3
          go work edit -replace github.com/0xPolygon/polygon-edge=github.com/mocachain/polygon-edge@v1.3.3-moca.1
          go work edit -replace github.com/99designs/keyring=github.com/cosmos/keyring@v1.2.0
          go work edit -replace github.com/btcsuite/btcd/btcec/v2=github.com/btcsuite/btcd/btcec/v2@v2.3.4
          go work edit -replace github.com/gin-gonic/gin=github.com/gin-gonic/gin@v1.9.1
          go work edit -replace github.com/lyft/protoc-gen-validate=github.com/bufbuild/protoc-gen-validate@v0.0.13
          go work edit -replace nhooyr.io/websocket=nhooyr.io/websocket@v1.8.17
          echo "GOWORK=$RUNNER_TEMP/moca-go-sdk-e2e/go.work" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          go mod download
      - name: Install compatible contract tools
        run: |
          GOTOOLCHAIN=go1.23.11 go install golang.org/x/tools/cmd/stringer@v0.30.0
          GOTOOLCHAIN=go1.23.11 go install github.com/go-bindata/go-bindata/v3/go-bindata@v3.1.3
          GOTOOLCHAIN=go1.23.11 go install github.com/fjl/gencodec@latest
          GOTOOLCHAIN=go1.23.11 go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          GOTOOLCHAIN=go1.23.11 go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      # Build Moca
      - name: Build Moca
        run: |
          cd ../moca
          make build
          cd ..
      # Build Moca-SP
      - name: Build Moca-SP
        run: |
          git clone https://github.com/mocachain/moca-storage-provider.git ../moca-storage-provider
          cd ../moca-storage-provider
          git checkout ${{ env.MocaStorageProviderTag }}
          make install-tools
          make build
          cd ../moca-go-sdk
      # Run MySQL
      - name: Run MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -h ${{ env.MYSQL_IP }} -P ${{ env.MYSQL_PORT }} -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }} -e 'CREATE DATABASE sp_0; CREATE DATABASE sp_1;CREATE DATABASE sp_2; CREATE DATABASE sp_3;CREATE DATABASE sp_4; CREATE DATABASE sp_5; CREATE DATABASE sp_6;'
      # Run Moca
      - name: Run Moca
        run: |
          cd ../moca
          bash ./deployment/localup/localup.sh all 1 8
          bash ./deployment/localup/localup.sh export_sps 1 8
          cp ./deployment/localup/.local/sp_export.json ./sp.json
          cat sp.json
          cd ../moca-go-sdk
      # Run Moca-SP
      - name: Run Moca-SPs
        run: |
          cd ../moca-storage-provider
          sed -i 's/^SP_NUM=.*/SP_NUM=2/' deployment/localup/env.info
          bash ./deployment/localup/localup.sh --generate $GITHUB_WORKSPACE/../moca/sp.json ${{ env.MYSQL_USER }} ${{ env.MYSQL_PASSWORD }} ${{ env.MYSQL_IP }}:${{ env.MYSQL_PORT }}
          bash ./deployment/localup/localup.sh --reset
          bash ./deployment/localup/localup.sh --start
          sleep 60
          for sp_dir in deployment/localup/local_env/sp*; do
            [ -d "${sp_dir}" ] || continue
            sp_name=$(basename "${sp_dir}")
            sp_index="${sp_name#sp}"
            sp_bin="${sp_dir}/moca-sp${sp_index}"
            sp_config="${sp_dir}/config.toml"
            if [ -x "${sp_bin}" ] && [ -f "${sp_config}" ]; then
              "${sp_bin}" update.quota --quota 5000000000 -c "${sp_config}"
            fi
          done
          ps -ef | grep moca-sp | wc -l
          tail -n 1000 deployment/localup/local_env/sp0/log.txt
          cd ../moca-go-sdk
      # Run E2E Test
      - name: start e2e
        env:
          MOCA_E2E_LOCALUP_DIR: ${{ github.workspace }}/../moca/deployment/localup/.local
        run: |
          set +e
          make e2e_test
          exit_status_command=$?
          if [ $exit_status_command -eq 0 ]; then
            echo "make e2e_test successful."
          else
            cd ../moca-storage-provider
            cat ./deployment/localup/local_env/sp0/log.txt
            cat ./deployment/localup/local_env/sp1/log.txt
            cat ./deployment/localup/local_env/sp2/log.txt
            cat ./deployment/localup/local_env/sp3/log.txt
            cat ./deployment/localup/local_env/sp4/log.txt
            cat ./deployment/localup/local_env/sp5/log.txt
            cat ./deployment/localup/local_env/sp6/log.txt
            cat ./deployment/localup/local_env/sp7/log.txt
            exit $exit_status_command
          fi
          cd ..
