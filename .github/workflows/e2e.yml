name: End to End Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  GOPRIVATE: github.com/mocachain
  MOCA_E2E_MOCAD_IMAGE: ghcr.io/mocachain/mocad:main
  MOCA_E2E_SP_IMAGE: ghcr.io/mocachain/moca-storage-provider:main

jobs:
  end-to-end-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        os: [ubuntu-latest]
    env:
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPROXY: https://proxy.golang.org,direct
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Pull e2e images
        working-directory: .github/e2e
        run: |
          docker pull "${MOCA_E2E_MOCAD_IMAGE}"
          docker pull "${MOCA_E2E_SP_IMAGE}"
          docker pull mysql:8.0

      - name: Start image-only local stack
        working-directory: .github/e2e
        run: |
          rm -rf .docker-shared
          mkdir -p .docker-shared
          docker compose -f docker-compose.yml down -v --remove-orphans || true
          docker compose -f docker-compose.yml up -d
          for i in {1..180}; do
            height=$(curl -sf http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height // "0"' 2>/dev/null || echo 0)
            if [ "${height}" -ge 5 ] 2>/dev/null; then
              echo "chain ready at height ${height}"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs || true
          exit 1

      - name: Extract mocad from image
        run: |
          mkdir -p "${RUNNER_TEMP}/mocad-bin"
          cid=$(docker create --entrypoint /bin/sh "${MOCA_E2E_MOCAD_IMAGE}" -c true)
          docker cp "$cid:/usr/bin/mocad" "${RUNNER_TEMP}/mocad-bin/mocad"
          docker rm "$cid"
          chmod +x "${RUNNER_TEMP}/mocad-bin/mocad"

      - name: Run SDK e2e tests
        env:
          MOCA_E2E_LOCALUP_DIR: ${{ github.workspace }}/.github/e2e/.docker-shared
          MOCA_E2E_MOCAD: ${{ runner.temp }}/mocad-bin/mocad
          MOCA_E2E_GRPC_ENDPOINT: 127.0.0.1:19090
          MOCA_E2E_ENDPOINT: http://127.0.0.1:26657
          MOCA_E2E_EVM_ENDPOINT: http://127.0.0.1:8545
        run: |
          export GOMODCACHE="${RUNNER_TEMP}/go/pkg/mod"
          export GOCACHE="${RUNNER_TEMP}/go-build"
          echo "=== e2e network preflight ==="
          docker ps
          ss -ltnp | grep -E '(:19090|:26657|:8545|:9033|:9034|:9035)' || true
          make e2e_test

      - name: Dump image stack logs on failure
        if: failure()
        working-directory: .github/e2e
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs || true

      - name: Stop image stack
        if: always()
        working-directory: .github/e2e
        run: |
          docker compose -f docker-compose.yml down -v --remove-orphans || true
